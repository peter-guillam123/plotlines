# The gates, run by GitHub rather than only on the editor's laptop.
#
# Until this existed there was no CI at all: a push to main deployed
# whatever it contained, and the only thing standing between a broken book
# and the live map was remembering to run the tools. (Kim once took the
# live map down by skipping a chapter number.) These are the same
# deterministic checks tools/ship.mjs runs, across the whole shelf.
#
# Deliberately not here: the judged passes (text-vs-map, completeness,
# sensitivity, the pictures, the watch-through). They need judgement, and a
# green tick must never be mistaken for "this book is good".

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. It loads. The real js/data.js loader, headless, on every book:
      #    bad coordinates, unknown modes, character teleports, chapterless
      #    scenes, non-sequential chapters.
      - name: every book loads
        run: |
          fail=0
          for f in data/*.json; do
            case "$(basename "$f")" in
              novels.json|atlas.json|shelf-stats.json) continue ;;
            esac
            node tools/validate.mjs "$f" > /tmp/out.txt 2>&1 || {
              echo "::error file=$f::validate failed"; cat /tmp/out.txt; fail=1;
            }
          done
          exit $fail

      # 2. It plays. Runtime, camera leaps, silent rewinds, uncovered
      #    movements, scene-vs-map contradictions, route spills (an error:
      #    a leg drawn across the wrong medium is a plain lie on the map).
      - name: every book plays
        run: |
          fail=0
          for f in data/*.json; do
            case "$(basename "$f")" in
              novels.json|atlas.json|shelf-stats.json) continue ;;
            esac
            node tools/rushes.mjs "$f" > /tmp/out.txt 2>&1 || {
              echo "::error file=$f::rushes failed"; cat /tmp/out.txt; fail=1;
            }
          done
          exit $fail

      # 3. Every place is a decided question: an image, or a logged reason
      #    there isn't one.
      - name: every place decided
        run: node tools/images.mjs

      # 4. The shelf's generated indexes are fresh - the check that catches
      #    a book added without rebuilding the sort stats, which otherwise
      #    fails silently and sorts it to the bottom of two orders.
      - name: shelf stats fresh
        run: node tools/check-shelf-stats.mjs

      # 5. The atlas index really is the shelf's places, not a stale copy.
      #    Rebuild into a temp file and compare rather than trusting it.
      - name: atlas index current
        run: |
          cp data/atlas.json /tmp/atlas-committed.json
          node tools/build-atlas.mjs
          if ! diff -q /tmp/atlas-committed.json data/atlas.json > /dev/null; then
            echo "::error::data/atlas.json is stale - run: node tools/build-atlas.mjs"
            exit 1
          fi
